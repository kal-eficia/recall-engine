[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-engine"
version = "1.0.0"
description = "Spaced-retrieval lesson starters and six-week progress reviews for recall-first teaching. Works from a CSV question bank and attempts log."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kalid Nur" }]
keywords = ["education", "spaced-repetition", "retrieval-practice", "assessment", "teachers", "edtech"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Education",
  "Topic :: Education :: Testing",
]

[project.scripts]
recall-engine = "recall_engine.cli:main"

[tool.setuptools]
packages = ["recall_engine"]
